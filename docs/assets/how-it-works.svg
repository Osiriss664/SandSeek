<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">How SandSeek works</title>
  <desc id="d">Your question goes to SandSeek on your Mac. A local model server plans the research. Searches and page reads run in a throwaway Linux VM, the only part that touches the internet. Page text comes back marked as untrusted, and the answer with numbered sources stays on your Mac.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4A5868"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="#FFFFFF"/>

  <!-- the Mac -->
  <rect x="20" y="20" width="640" height="430" rx="16" fill="#F3F6FA" stroke="#C9D3DF" stroke-width="2"/>
  <text x="44" y="54" font-size="18" font-weight="700" fill="#1F3A5F">Your Mac</text>
  <text x="44" y="76" font-size="13" fill="#5B6878">The question and the answer never leave it</text>

  <!-- you -->
  <rect x="44" y="110" width="150" height="80" rx="12" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="2"/>
  <text x="119" y="144" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">You</text>
  <text x="119" y="166" font-size="13" fill="#5B6878" text-anchor="middle">ask a question</text>

  <!-- SandSeek app -->
  <rect x="250" y="100" width="180" height="100" rx="12" fill="#1F3A5F"/>
  <text x="340" y="140" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">SandSeek app</text>
  <text x="340" y="162" font-size="13" fill="#D7E3F1" text-anchor="middle">runs the research loop,</text>
  <text x="340" y="180" font-size="13" fill="#D7E3F1" text-anchor="middle">saves the report</text>

  <!-- model server -->
  <rect x="470" y="100" width="170" height="100" rx="12" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="2"/>
  <text x="555" y="138" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">Local model</text>
  <text x="555" y="160" font-size="13" fill="#5B6878" text-anchor="middle">TUFF or llama.cpp</text>
  <text x="555" y="178" font-size="13" fill="#5B6878" text-anchor="middle">on 127.0.0.1 only</text>

  <!-- report -->
  <rect x="44" y="300" width="150" height="110" rx="12" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="2"/>
  <text x="119" y="336" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">Answer</text>
  <text x="119" y="358" font-size="13" fill="#5B6878" text-anchor="middle">with numbered</text>
  <text x="119" y="376" font-size="13" fill="#5B6878" text-anchor="middle">sources, kept as</text>
  <text x="119" y="394" font-size="13" fill="#5B6878" text-anchor="middle">a report</text>

  <!-- sandbox VM -->
  <rect x="250" y="270" width="390" height="150" rx="14" fill="#FFF6E5" stroke="#D99A3E" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="274" y="302" font-size="16" font-weight="700" fill="#7A4E12">Sandbox: a throwaway Linux VM</text>
  <text x="274" y="326" font-size="13" fill="#7A4E12">Apple container · web search, page reading, text PDFs</text>
  <text x="274" y="350" font-size="13" fill="#7A4E12">No shell, no files, no access to your Mac</text>
  <text x="274" y="374" font-size="13" fill="#7A4E12">Read-only, firewalled, answers signed</text>
  <text x="274" y="398" font-size="13" fill="#7A4E12">Page text is marked as untrusted</text>

  <!-- internet -->
  <rect x="720" y="270" width="210" height="150" rx="14" fill="#EEF1F4" stroke="#C9D3DF" stroke-width="2"/>
  <text x="825" y="330" font-size="17" font-weight="700" fill="#1F2933" text-anchor="middle">Internet</text>
  <text x="825" y="354" font-size="13" fill="#5B6878" text-anchor="middle">gets only search words</text>
  <text x="825" y="372" font-size="13" fill="#5B6878" text-anchor="middle">and page addresses</text>

  <!-- arrows -->
  <path d="M194 150 L246 150" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M430 138 L466 138" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M466 166 L434 166" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="448" y="128" font-size="11" fill="#5B6878" text-anchor="middle">ask</text>
  <text x="448" y="184" font-size="11" fill="#5B6878" text-anchor="middle">plan</text>
  <path d="M320 200 L320 266" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M360 266 L360 204" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="314" y="238" font-size="11" fill="#5B6878" text-anchor="end">search, open page</text>
  <text x="366" y="238" font-size="11" fill="#5B6878">cleaned text</text>
  <path d="M640 330 L716 330" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M716 360 L644 360" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M250 180 C 200 190, 130 220, 120 296" stroke="#4A5868" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
</svg>
