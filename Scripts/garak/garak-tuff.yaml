# garak generator config for TUFF's OpenAI-compatible server (garak 0.17.0).
# The model name is not set here: run_garak.sh passes it with --target_name.
# Port 8080 is TUFF's default. run_garak.sh rewrites the uri and the prompt cap
# (prompts per probe class) from TUFF_PORT and GARAK_PROMPT_CAP.
run:
  soft_probe_prompt_cap: 8

plugins:
  generators:
    openai:
      OpenAICompatible:
        uri: http://127.0.0.1:8080/v1/
        temperature: 0.7
        top_p: 1.0
        max_tokens: 400
        suppressed_params:
          - stop
          - frequency_penalty
          - presence_penalty
          - seed
          - n
        extra_params:
          extra_body:
            enable_thinking: false
