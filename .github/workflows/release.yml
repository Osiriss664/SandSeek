# Builds a SandSeek release when a version tag is pushed, and leaves it as a
# DRAFT on GitHub. Nothing here publishes: the maintainer downloads the draft,
# checks it and tests that exact zip on a Mac, then publishes by hand
# (CONTRIBUTING.md, "Releases").
#
# What the draft holds, and why:
# - SandSeek-<version>.zip         the app (signed ad hoc, not notarized)
# - sandseek-<version>-macos-arm64.tar.gz   the command and the sandbox files it needs
# - sandseek-<version>.spdx.json   the SBOM (Scripts/make_sbom.py)
# - SHA256SUMS                     checksums of the three files above
# - *.provenance.intoto.jsonl      who built which file from which commit (GitHub attestation)
# - *.sbom.intoto.jsonl            the SBOM, attested for the zip
#
# Rules this file keeps on purpose:
# - Every action is pinned by commit, not by tag, so a moved tag cannot change
#   what runs with these permissions.
# - The workflow-wide token can only read. Only the one job gets write rights,
#   and it needs them to create the draft and to sign attestations.
# - Values that come from outside (the tag name, the tag input) are never put
#   into a script with ${{ }}. They go through environment variables, and the
#   tag is checked against a strict pattern before anything else uses it.
# - An existing release is never overwritten.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, like v0.5.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # macos-26 has Xcode 26 and Swift 6.2, which Package.swift needs.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write       # create the draft release and upload its files
      id-token: write       # sign the attestations
      attestations: write   # store the attestations
    steps:
      - name: Check the tag name
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like v1.2.3, not: $tag" >&2
            exit 1
          fi
          # Safe to write: it just matched the pattern above.
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check the version and the changelog
        run: |
          set -euo pipefail
          # The same sed as Scripts/package_app.sh, so the app, the command and
          # the tag cannot disagree.
          source_version="$(sed -n 's/^ *public static let current = "\([^"]*\)".*/\1/p' Sources/SandSeekCore/SandSeekVersion.swift)"
          if [[ -z "$source_version" ]]; then
            echo "Could not read the version from Sources/SandSeekCore/SandSeekVersion.swift." >&2
            exit 1
          fi
          if [[ "$source_version" != "$VERSION" ]]; then
            echo "The tag $TAG is for $VERSION, but SandSeekVersion.swift says $source_version." >&2
            exit 1
          fi
          # CHANGELOG.md needs a "## <version> (" heading, and a "### Security"
          # subsection before the next "## " heading.
          if ! awk -v heading="## $VERSION (" '
              substr($0, 1, length(heading)) == heading { inside = 1; next }
              inside && substr($0, 1, 3) == "## " { exit }
              inside && $0 ~ /^### Security[[:space:]]*$/ { found = 1 }
              END { exit found ? 0 : 1 }
            ' CHANGELOG.md; then
            echo "CHANGELOG.md needs a '## $VERSION (' heading with a '### Security' subsection." >&2
            exit 1
          fi

      - name: Refuse if a release for this tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists. This workflow never overwrites one." >&2
            exit 1
          fi

      - name: Swift tests
        run: swift test

      - name: Python tests
        run: |
          set -euo pipefail
          python3 -m unittest Sandbox/test_server.py
          python3 -m unittest discover -s Scripts -p 'test_*.py'

      - name: Build the app
        run: |
          set -euo pipefail
          Scripts/package_app.sh
          mkdir -p dist
          ditto -c -k --keepParent build/SandSeek.app "dist/SandSeek-$VERSION.zip"

      - name: Build the command line tool
        run: |
          set -euo pipefail
          swift build -c release --product sandseek
          bin_path="$(swift build -c release --show-bin-path)"

          # The tarball has the layout of a checkout where the command can find
          # the sandbox: Scripts/research_sandbox.sh next to Sandbox/, because
          # the script builds the image from ../Sandbox.
          name="sandseek-$VERSION-macos-arm64"
          stage="$RUNNER_TEMP/$name"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/share/sandseek/Scripts" "$stage/share/sandseek/Sandbox"
          cp "$bin_path/sandseek" "$stage/bin/sandseek"
          chmod 755 "$stage/bin/sandseek"
          cp LICENSE NOTICE "$stage/"
          cp Scripts/research_sandbox.sh "$stage/share/sandseek/Scripts/research_sandbox.sh"
          chmod 755 "$stage/share/sandseek/Scripts/research_sandbox.sh"
          # The same files as Contents/Resources/sandbox/Sandbox in the app.
          rsync -a --exclude '__pycache__' --exclude '*.pyc' --exclude '.DS_Store' \
              Sandbox/ "$stage/share/sandseek/Sandbox/"

          # Same input, same tarball, as far as macOS tar allows: fixed owner,
          # one fixed modification time (the commit's), a sorted file list, no
          # Finder metadata, and gzip without a name or time in its header.
          commit_time="$(git log -1 --format=%ct)"
          find "$stage" -exec touch -h -t "$(date -u -r "$commit_time" +%Y%m%d%H%M.%S)" {} +
          (cd "$RUNNER_TEMP" && find "$name" | LC_ALL=C sort > "$name.list")
          (cd "$RUNNER_TEMP" && COPYFILE_DISABLE=1 tar -c -n --uid 0 --gid 0 --uname root --gname wheel \
              -T "$name.list" -f - | gzip -n -9 > "$GITHUB_WORKSPACE/dist/$name.tar.gz")

      - name: Write the SBOM
        run: |
          set -euo pipefail
          # Not GITHUB_SHA: for workflow_dispatch that is the branch, not the tag.
          source_commit="$(git rev-parse HEAD)"
          python3 Scripts/make_sbom.py --version "$VERSION" --source-commit "$source_commit" \
              --created "$(date -u -r "$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)" \
              --output "dist/sandseek-$VERSION.spdx.json"

      - name: Write the checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 SandSeek-*.zip sandseek-*.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SandSeek-${{ env.VERSION }}.zip
            dist/sandseek-${{ env.VERSION }}-macos-arm64.tar.gz

      - name: Attest the SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/SandSeek-${{ env.VERSION }}.zip
          sbom-path: dist/sandseek-${{ env.VERSION }}.spdx.json

      - name: Add the attestations to dist
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "dist/SandSeek-$VERSION.provenance.intoto.jsonl"
          cp "$SBOM_BUNDLE" "dist/SandSeek-$VERSION.sbom.intoto.jsonl"

      - name: Write the release notes
        run: |
          set -euo pipefail
          # The section of CHANGELOG.md for this version, without its heading.
          awk -v heading="## $VERSION (" '
              substr($0, 1, length(heading)) == heading { inside = 1; next }
              inside && substr($0, 1, 3) == "## " { exit }
              inside { print }
            ' CHANGELOG.md > notes.md
          {
            echo
            echo "## Verify"
            echo
            echo "Download all files of this release into one folder, then:"
            echo
            echo '```'
            echo "shasum -a 256 -c SHA256SUMS"
            echo "gh attestation verify SandSeek-$VERSION.zip --repo Osiriss664/SandSeek"
            echo '```'
            echo
            echo "The app is signed ad hoc and is not notarized; see docs/INSTALL.md."
          } >> notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Always a draft. A person publishes it after testing this exact zip.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "SandSeek $VERSION" --notes-file notes.md dist/*

      - name: Keep the files as a workflow artifact too
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandseek-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
