name: Bug report
description: Something in SandSeek does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems do not belong here**: see SECURITY.md and report them privately.
        Please remove anything private (questions you asked, file paths with your name) from logs before you paste them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - The SandSeek app
        - The sandseek command
        - The web sandbox (start, security check, search, reading pages or PDFs)
        - Install or build
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SandSeek (`sandseek --version`), macOS, Apple container (`container --version`), model server and model.
      placeholder: "sandseek 0.2.0, macOS 26.1, container 1.5.0, TUFF 8.3.1 with Qwen3.6 35B-A3B"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Messages or log lines
      description: The exact text of any error, and for sandbox problems the output of the Security check.
      render: text
